
<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrato Veicular</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;

        }
        header {
            padding: 10px;
            background-color: #004aad;
